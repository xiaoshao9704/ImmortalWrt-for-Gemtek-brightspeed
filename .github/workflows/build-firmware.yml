name: Build Firmware

# Pushing a tag that starts with v (for example v20261026-5b3d606) builds
# firmware and publishes a GitHub Release on that same tag. No second tag is
# created. workflow_dispatch stays available for manual builds.
#
# Tag config seed (case-insensitive, first match): *2g* -> 2010-2g.config,
# *1710* -> 1710.config, otherwise 2010.config (XG2010G, this fork's default).
# Tags containing rc, beta, or pre are prereleases; other v* tags are full
# releases. Manual dispatch still uses its inputs. A dispatch release still
# creates a YYYYMMDD-<commit> tag, which does not match v* and does not
# retrigger this workflow.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      config_seed:
        description: 'Build config'
        required: true
        default: '1710.config'
        type: choice
        options:
          - 1710.config
          - 2010.config
          - 2010-2g.config
      release_type:
        description: 'Release Type'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - release
          - prerelease
      release_notes:
        description: 'Release Notes'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve build inputs
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_CONFIG_SEED: ${{ github.event.inputs.config_seed }}
          INPUT_RELEASE_TYPE: ${{ github.event.inputs.release_type }}
        run: |
          set -euo pipefail

          event_name="${EVENT_NAME}"
          ref_name="${REF_NAME}"
          input_config_seed="${INPUT_CONFIG_SEED:-}"
          input_release_type="${INPUT_RELEASE_TYPE:-}"
          publish_release=false
          prerelease=false

          if [ "$event_name" = "workflow_dispatch" ]; then
            config_seed="$input_config_seed"
            case "$input_release_type" in
              release)
                publish_release=true
                prerelease=false
                ;;
              prerelease)
                publish_release=true
                prerelease=true
                ;;
              none|'')
                publish_release=false
                prerelease=false
                ;;
              *)
                echo "Unsupported release_type: $input_release_type" >&2
                exit 1
                ;;
            esac
          else
            # Tag push. Case-insensitive first match on the tag name.
            shopt -s nocasematch
            if [[ "$ref_name" == *2g* ]]; then
              config_seed="2010-2g.config"
            elif [[ "$ref_name" == *1710* ]]; then
              config_seed="1710.config"
            else
              config_seed="2010.config"
            fi
            publish_release=true
            if [[ "$ref_name" == *rc* || "$ref_name" == *beta* || "$ref_name" == *pre* ]]; then
              prerelease=true
            fi
          fi

          case "$config_seed" in
            1710.config|2010.config|2010-2g.config) ;;
            *)
              echo "Unsupported config seed: ${config_seed:-<empty>}" >&2
              exit 1
              ;;
          esac

          echo "config_seed=$config_seed" >> "$GITHUB_OUTPUT"
          echo "publish_release=$publish_release" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Resolved config_seed=$config_seed publish_release=$publish_release prerelease=$prerelease event=$event_name ref=$ref_name"

      - name: Generate build version
        id: version
        env:
          CONFIG_SEED: ${{ steps.resolve.outputs.config_seed }}
        run: |
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git 2>/dev/null || true
          git remote set-url upstream https://github.com/immortalwrt/immortalwrt.git
          git fetch --no-tags upstream master

          build_date=$(TZ=Asia/Shanghai date +'%Y%m%d')
          repo_commit=$(git rev-parse --short=8 HEAD)
          upstream_base=$(git merge-base HEAD upstream/master)
          upstream_commit=$(git rev-parse --short=8 "$upstream_base")
          build_id="${build_date}-${repo_commit}-${upstream_commit}"
          # 文件名只保留 “日期-本机commit”，完整 build_id 落到 VERSION_CODE
          version_number="${build_date}-${repo_commit}"
          version_code="${build_id}"

          echo "date=$build_date" >> $GITHUB_OUTPUT
          echo "build_id=$build_id" >> $GITHUB_OUTPUT
          echo "repo_commit=$repo_commit" >> $GITHUB_OUTPUT
          echo "upstream_commit=$upstream_commit" >> $GITHUB_OUTPUT
          echo "version_number=$version_number" >> $GITHUB_OUTPUT
          echo "version_code=$version_code" >> $GITHUB_OUTPUT
          case "$CONFIG_SEED" in
            1710.config) device_model=XR1710G ;;
            2010.config) device_model=XG2010G ;;
            2010-2g.config) device_model=XG2010G-2G ;;
            *) echo "Unsupported config seed: $CONFIG_SEED" >&2; exit 1 ;;
          esac
          echo "device_model=$device_model" >> $GITHUB_OUTPUT
          echo "Build version: ImmortalWrt-for-Gemtek-brightspeed $device_model $version_number"

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang gcc g++ binutils bzip2 gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip wget xsltproc zlib1g-dev file which perl sed make

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash scripts/fix-stale-golang-host.sh

      - name: Apply feed patches
        run: FEED_PATCHES_STRICT=1 bash scripts/apply-feed-patches.sh

      - name: Configure
        env:
          CONFIG_SEED: ${{ steps.resolve.outputs.config_seed }}
        run: |
          cp "$CONFIG_SEED" .config
          BUILD_DATE='${{ steps.version.outputs.date }}' \
          BUILD_ID='${{ steps.version.outputs.build_id }}' \
          REPO_COMMIT='${{ steps.version.outputs.repo_commit }}' \
          UPSTREAM_COMMIT='${{ steps.version.outputs.upstream_commit }}' \
          VERSION_CODE='${{ steps.version.outputs.version_code }}' \
          bash scripts/set-build-version.sh .config
          make defconfig
          bash scripts/check-distfeeds.sh
          bash scripts/check-gemtek-profile-isolation.sh --config .config
          grep -E 'CONFIG_(IMAGEOPT|EXTRA_IMAGE_NAME|VERSIONOPT|VERSION_DIST|VERSION_NUMBER|VERSION_CODE|VERSION_FILENAMES|VERSION_CODE_FILENAMES)[= ]' .config

      - name: Verify libffi build dependency
        run: |
          test -f package/libs/libffi/Makefile
          awk '
            /^Source-Makefile:/ { in_libffi = ($2 == "package/libs/libffi/Makefile") }
            in_libffi && /^Package: libffi$/ { have_package = 1 }
            in_libffi && /^Build-Types:/ {
              for (i = 2; i <= NF; i++) if ($i == "host") have_host = 1
            }
            END {
              if (!have_package || !have_host) {
                print "libffi package with host build support is missing from package metadata" > "/dev/stderr"
                exit 1
              }
            }
          ' tmp/.packageinfo

      - name: Download sources
        shell: bash
        run: |
          make download -j$(nproc) BUILD_LOG=1 2>&1 | tee download.log

      - name: Build Firmware
        shell: bash
        run: |
          make -j2 world BUILD_LOG=1 2>&1 | tee build.log

      - name: Verbose retry on build failure
        if: failure()
        shell: bash
        run: |
          bash scripts/summarize-build-errors.sh build.log || true
          failed_pkg=$(grep 'ERROR:.*failed to build' build.log | head -1 | sed 's/.*ERROR: \(.*\) failed to build.*/\1/' || true)
          if [ -n "$failed_pkg" ]; then
            echo "=== Rebuilding $failed_pkg with V=s ==="
            retry_status=0
            make "${failed_pkg}/compile" BUILD_LOG=1 V=s -j1 2>&1 | tee build-verbose.log || retry_status=$?
            echo "=== First errors in build-verbose.log ==="
            grep -nE "error:|Error [0-9]|FAILED|Patch failed|No rule to make target" build-verbose.log | head -40 || true
            echo "=== tail of build-verbose.log ==="
            tail -80 build-verbose.log || true
            exit "$retry_status"
          else
            echo "No failing package found in build.log" >&2
            tail -150 build.log || true
          fi

      - name: Verify device isolation
        shell: bash
        run: |
          bash scripts/check-firmware-artifacts.sh \
            --config .config \
            --directory bin/targets/airoha/an7581
          kernel_config=$(find build_dir/target-aarch64_cortex-a53_musl/linux-airoha_an7581 -path '*/linux-*/.config' -print -quit)
          manifest=$(find bin/targets/airoha/an7581 -maxdepth 1 -type f -name '*manifest' -print -quit)
          test -n "$kernel_config"
          test -n "$manifest"
          bash scripts/check-gemtek-profile-isolation.sh \
            --config .config \
            --kernel-config "$kernel_config" \
            --manifest "$manifest"

      - name: Check build status
        if: always()
        run: |
          if [ -f build.log ]; then
            bash scripts/summarize-build-errors.sh build.log || true
            tail -100 build.log
          fi
          echo "=== List all files in bin/targets/airoha/an7581/ ==="
          ls -la bin/targets/airoha/an7581/ 2>/dev/null || echo "No files found in an7581 directory"
          echo "=== List all files in bin/targets/airoha/ ==="
          ls -la bin/targets/airoha/ 2>/dev/null || echo "No files found in airoha directory"
          echo "=== List all files in bin/targets/ ==="
          ls -la bin/targets/ 2>/dev/null || echo "No files found in targets directory"
          echo "=== List all files in bin/ ==="
          ls -la bin/ 2>/dev/null || echo "No files found in bin directory"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gemtek-${{ steps.resolve.outputs.config_seed }}-firmware
          path: |
            download.log
            build.log
            build-verbose.log
            logs/
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/*manifest
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
          retention-days: 30
        if: always()

      - name: Build release body
        if: success() && steps.resolve.outputs.publish_release == 'true'
        id: release_body
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          CONFIG_SEED: ${{ steps.resolve.outputs.config_seed }}
        run: |
          {
            if [ "$EVENT_NAME" = "push" ]; then
              printf 'Tag: `%s`\n' "$REF_NAME"
              printf 'Config: `%s`\n' "$CONFIG_SEED"
              echo ""
            fi
            printf '%s\n' "$RELEASE_NOTES"
            echo ""
            echo "---"
            echo ""
            echo "如果您觉得对您有帮助，请我喝杯咖啡吧，让我更有动力持续更新。"
            echo ""
            echo '<img width="400" height="400" alt="c6ea388c976395326514814f80d512d5" src="https://github.com/user-attachments/assets/0ac90d58-ac73-4dc1-b926-276e539e5d0f" />'
          } > /tmp/release_body.md
          {
            echo "body<<EOF"
            cat /tmp/release_body.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release
        # Tag pushes attach the release to github.ref_name (the tag that was
        # pushed). Dispatch releases still create YYYYMMDD-<commit>.
        # target_commitish is the built SHA; GitHub ignores it when the tag
        # already exists, so a tag push does not move or recreate that tag.
        if: success() && steps.resolve.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('{0}-{1}', steps.version.outputs.date, steps.version.outputs.repo_commit) }}
          target_commitish: ${{ github.sha }}
          name: ${{ format('{0} - Gemtek {1} Build ({2})', steps.version.outputs.date, steps.version.outputs.device_model, steps.version.outputs.repo_commit) }}
          body: ${{ steps.release_body.outputs.body }}
          draft: false
          prerelease: ${{ steps.resolve.outputs.prerelease == 'true' }}
          files: |
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
